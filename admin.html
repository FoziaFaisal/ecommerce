<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | FF E-commerce Luxury Store</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:#0f0c0a;color:#f1e8d8;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;background:#080605;border:1px solid #c9a45c;color:#c9a45c;padding:14px 20px;border-radius:12px;margin-bottom:18px}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;font-weight:600;background:#c9a45c;color:#14100b}
button.sec{background:none;color:#c9a45c;border:1px solid #c9a45c}button.del{background:#b53a3a}
input,select,textarea{background:#0f0c0a;color:#f1e8d8;padding:8px;border:1px solid #5a4a2a;border-radius:8px;font:inherit;width:100%}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{background:none;color:#c9a45c;border:1px solid #c9a45c}.tabs .on{background:#c9a45c;color:#14100b}
.box{background:#17130f;border:1px solid #3a2f1c;color:#f1e8d8;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:8px;border-bottom:1px solid #2a2218;text-align:left;white-space:nowrap}
th{background:#241d15;color:#c9a45c}.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#ecd3cd;display:block}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.low{color:#b53a3a;font-weight:700}.ok{color:#1e7a3c}
#login{max-width:340px;margin:12vh auto;text-align:center}#login input{margin:14px 0}
</style></head><body>
<div id="login" class="box"><h2>Admin login</h2><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="le" class="low"></p></div>
<div id="app" style="display:none">
<div class="top"><b>FF E-commerce Luxury Store · Admin</b><button class="sec" onclick="location.reload()">Logout</button></div>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">Products</button><button id="t2" onclick="tab(2)">Orders</button></div>

<div id="p1">
<div class="box"><h3 id="ft">Add / edit product</h3><br>
<div class="form">
<input id="f_id" placeholder="ID (khali = nayi product)" readonly>
<input id="f_name" placeholder="Name"><select id="f_category"><option>Handbags</option><option>Shoes</option><option>Belts</option><option>Jackets</option><option>Jewellery</option><option>Sunglasses</option></select>
<input id="f_price" type="number" placeholder="Price"><input id="f_stock" type="number" placeholder="Stock">
<select id="f_status"><option>Active</option><option>SoldOut</option><option>Hidden</option></select>
<input id="f_image_url" placeholder="Image URL (ya neeche file chunein)"><input id="file" type="file" accept="image/*">
<textarea id="f_description" placeholder="Description" rows="1"></textarea></div><br>
<button onclick="save()" id="sb">Save product</button> <button class="sec" onclick="clr()">Clear</button> <span id="msg"></span></div>
<div class="box"><table><thead><tr><th>Image</th><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="pb"></tbody></table></div></div>

<div id="p2" style="display:none"><div class="box"><table><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Phone</th><th>Address</th><th>Product</th><th>Qty</th><th>Total</th><th>Status</th></tr></thead><tbody id="ob"></tbody></table></div></div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbxnPinWL6ajJ6k9b4ZytcAfNL0BfZTXyicnHN1eDbUJiJ1j-n7EJCAbzWsFX3D7GNav/exec';
let PW='',prods=[];const $=i=>document.getElementById(i);
const F=['id','name','category','price','stock','status','image_url','description'];
async function post(o){return (await fetch(API,{method:'POST',body:JSON.stringify({...o,pw:PW})})).json()}
async function login(){PW=$('pw').value;const r=await post({action:'login'});
  if(r.ok){$('login').style.display='none';$('app').style.display='block';loadP()}else $('le').textContent=r.error||'Galat password'}
function tab(n){$('p1').style.display=n==1?'':'none';$('p2').style.display=n==2?'':'none';$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':'';if(n==2)loadO()}
async function loadP(){prods=await (await fetch(API+'?action=products&t='+Date.now())).json();
  $('pb').innerHTML=prods.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${p.image_url}">`:'<span class="thumb"></span>'}</td><td>${p.id}</td><td>${p.name}</td><td>${p.category}</td><td>${p.price}</td>
  <td class="${p.stock<=3?'low':''}">${p.stock}</td><td class="${p.status=='Active'?'ok':'low'}">${p.status}</td>
  <td><button onclick="edit('${p.id}')">Edit</button> <button class="del" onclick="del('${p.id}')">Delete</button></td></tr>`).join('')}
async function loadO(){const r=await (await fetch(API+'?action=orders&pw='+encodeURIComponent(PW))).json();if(!r.ok)return;
  $('ob').innerHTML=r.orders.map(o=>`<tr><td>${o.order_id}</td><td>${new Date(o.date).toLocaleString()}</td><td>${o.customer_name}</td><td>${o.phone}</td><td>${o.address}</td><td>${o.product_name}</td><td>${o.qty}</td><td>${o.total}</td>
  <td><select onchange="post({action:'orderStatus',order_id:'${o.order_id}',status:this.value})">${['New','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}
function edit(id){const p=prods.find(x=>x.id==id);F.forEach(k=>$('f_'+k).value=p[k]);$('ft').textContent='Edit: '+p.name;scrollTo(0,0)}
function clr(){F.forEach(k=>$('f_'+k).value='');$('f_category').selectedIndex=0;$('f_status').selectedIndex=0;$('ft').textContent='Add / edit product'}
async function del(id){if(confirm('Delete karein?')){await post({action:'delete',id});loadP()}}
function shrink(file){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82).split(',')[1])};im.src=URL.createObjectURL(file)})}
async function save(){
  $('sb').disabled=true;$('msg').textContent='Saving…';
  try{
    const f=$('file').files[0];
    if(f){const r=await post({action:'upload',data:await shrink(f),mime:'image/jpeg',name:Date.now()+'.jpg'});if(r.ok)$('f_image_url').value=r.url;else throw r.error}
    const p={};F.forEach(k=>p[k]=$('f_'+k).value);
    if(!p.name||!p.price)throw 'Name aur price zaroori hain';
    const r=await post({action:'save',product:p});if(!r.ok)throw r.error;
    $('msg').textContent='Saved ✔';$('file').value='';clr();loadP();
  }catch(e){$('msg').textContent='Error: '+e}
  $('sb').disabled=false;
}
</script></body></html>
